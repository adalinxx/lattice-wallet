name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run conformance
      - run: npm audit --omit=dev
      - run: npm audit --omit=dev --prefix vendor/lattice-sdk
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: lattice-wallet-release-candidate
          path: release/
